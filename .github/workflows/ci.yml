name: ML Service CI/CD

on: [push, workflow_dispatch]

jobs:
  lint-and-test:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python 3.8
        uses: actions/setup-python@v4
        with:
          python-version: '3.8'

      - name: Install dependencies
        run: |
          cd app
          pip install -r requirements.txt
          pip install flake8 pytest

      - name: Lint with flake8
        run: |
          cd app
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-line-length=127 --statistics

      - name: Create model for tests
        run: |
          cd app
          python -c "import os, pickle; from sklearn.datasets import load_wine; from sklearn.linear_model import LogisticRegression; os.makedirs('model', exist_ok=True); X, y = load_wine(return_X_y=True); model = LogisticRegression(max_iter=2000).fit(X, y); pickle.dump(model, open('model/model.pkl', 'wb'))"

      - name: Run tests
        run: |
          cd app
          pytest -v

  build-and-push:
    runs-on: ubuntu-22.04
    needs: lint-and-test
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ghcr.io/nick-7815/ml-prediction-service/ml-app:latest
