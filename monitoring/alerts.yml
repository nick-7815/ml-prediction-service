groups:
  - name: ml-service-alerts
    interval: 30s
    rules:
      - alert: MLServiceDown
        expr: up{job="prediction-service"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "ML-сервис предсказаний недоступен"
          description: "Prometheus не может получить метрики с prediction-service более 1 минуты."

      - alert: LoggerServiceDown
        expr: up{job="logger-service"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Logger-сервис недоступен"
          description: "Prometheus не может получить метрики с logger-service более 1 минуты."

      - alert: HighPredictionLatency
        expr: histogram_quantile(0.95, rate(ml_prediction_latency_seconds_bucket[5m])) > 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Высокая задержка предсказаний"
          description: "95-й процентиль задержки превышает 1 секунду."

      - alert: NoPredictionsReceived
        expr: rate(ml_predictions_total[10m]) == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Нет предсказаний за 10 минут"
          description: "Сервис не получал запросов на предсказание в течение 10 минут."

      - alert: LoggerErrors
        expr: increase(logger_db_errors_total[5m]) > 3
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Ошибки записи в logger-service"
          description: "Более 3 ошибок записи в БД за 5 минут на стороне logger-service."

      - alert: PredictionLoggerErrors
        expr: increase(ml_logger_errors_total[5m]) > 3
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "prediction-service не может достучаться до logger-service"
          description: "Более 3 ошибок вызова logger-service за 5 минут."
