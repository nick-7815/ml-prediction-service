version: "3.8"

services:
  ml-service:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: ml-prediction-service:1.0
    container_name: ml-service
    ports:
      - "5000:5000"
    environment:
      - DB_HOST=10.10.10.101
      - DB_NAME=ml_predictions
      - DB_USER=ml_app
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_SSLMODE=require
    restart: unless-stopped