version: '3.8'

services:
  ml-app:
    image: ghcr.io/nick-7815/ml-prediction-service/ml-app:latest
    ports:
      - "5000:5000"
    environment:
      - DB_HOST=10.10.10.101
      - DB_NAME=ml_predictions
      - DB_USER=ml_app
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_SSLMODE=require
      - MODEL_PATH=/model/model.pkl
    restart: unless-stopped
